{% extends "store/base.html" %}
{% block title %}Checkout - FreshCart{% endblock %}
{% block content %}
<div class="container section" style="max-width:700px;">
  <h2>Checkout</h2>
  <div class="contact-card">
    <h3 style="margin-top:0;">Order Summary</h3>
    {% for item in cart %}
    <div class="summary-row"><span>{{ item.product.name }} × {{ item.quantity }}</span><span>₹{{ item.total_price }}</span></div>
    {% endfor %}
    <div class="summary-row total"><span>Total</span><span>₹{{ cart.get_total_price }}</span></div>

    <button id="rzp-button1" class="btn btn-primary btn-block" style="margin-top:20px;">Pay with Razorpay</button>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    var options = {
        "key": "{{ razorpay_merchant_key }}", 
        "amount": "{{ razorpay_amount }}", 
        "currency": "{{ currency }}",
        "name": "FreshCart",
        "description": "Grocery Purchase",
        "order_id": "{{ razorpay_order_id }}", 
        "callback_url": "{{ callback_url }}",
        "redirect": true,
        "prefill": {
            "name": "{{ request.user.username|default:'Guest User' }}",
            "email": "{{ request.user.email|default:'test@example.com' }}",
            "contact": "9999999999"
        },
        "theme": {
            "color": "#1ea550" // FreshCart green
        }
    };
    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
    </script>
  </div>
</div>
{% endblock %}
